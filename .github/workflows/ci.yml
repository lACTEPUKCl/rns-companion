name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Релиз по тегу создаётся от GITHUB_TOKEN — нужна запись (в новых репо по умолчанию read-only).
permissions:
  contents: write

env:
  PROJECT: src/RnsCompanion/RnsCompanion.csproj
  # MSI SimplySign Desktop (Certum) — кэшируется action'ом подписи
  SIMPLYSIGN_URL: "https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.3.90/SimplySignDesktop-9.4.3.90-64-bit-en.msi"
  # Секреты подписи (Settings → Secrets): CERTUM_USERNAME / CERTUM_OTP_URI / CERTUM_KEY_ID.
  # Пока их нет — шаги подписи пропускаются, релиз собирается как раньше.
  CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore $env:PROJECT

      - name: Build (Release)
        run: dotnet build $env:PROJECT -c Release --no-restore

      - name: Publish (single-file win-x64)
        run: |
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:DebugSymbols=false `
            -o publish

      # ── Подпись кода (только релизы по тегу и только когда настроены секреты Certum) ──
      - name: Cache SimplySign Installer
        if: startsWith(github.ref, 'refs/tags/v') && env.CERTUM_KEY_ID != ''
        uses: actions/cache@v4
        with:
          path: SimplySignDesktop.msi
          key: simplysign-msi-${{ env.SIMPLYSIGN_URL }}

      - name: Setup Certum SimplySign environment
        if: startsWith(github.ref, 'refs/tags/v') && env.CERTUM_KEY_ID != ''
        uses: dismine/windows-app-signing-setup-action@v1
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}
          simplysign-url: ${{ env.SIMPLYSIGN_URL }}

      - name: Sign exe
        if: startsWith(github.ref, 'refs/tags/v') && env.CERTUM_KEY_ID != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          & $signtool.FullName sign /tr http://timestamp.certum.pl /td sha256 /fd sha256 `
            /sha1 $env:CERTUM_KEY_ID "publish/RNS.Companion.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA256
        shell: pwsh
        run: |
          $exe = "publish/RNS.Companion.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RNS.Companion.exe" | Out-File -FilePath "publish/RNS.Companion.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RNS.Companion-win-x64
          path: |
            publish/RNS.Companion.exe
            publish/RNS.Companion.exe.sha256

      - name: GitHub Release (по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/RNS.Companion.exe
            publish/RNS.Companion.exe.sha256
          generate_release_notes: true
