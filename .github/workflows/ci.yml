name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Релиз по тегу создаётся от GITHUB_TOKEN — нужна запись (в новых репо по умолчанию read-only).
permissions:
  contents: write

env:
  PROJECT: src/RnsCompanion/RnsCompanion.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore $env:PROJECT

      - name: Build (Release)
        run: dotnet build $env:PROJECT -c Release --no-restore

      - name: Publish (single-file win-x64)
        run: |
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:DebugSymbols=false `
            -o publish

      - name: SHA256
        shell: pwsh
        run: |
          $exe = "publish/RNS.Companion.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RNS.Companion.exe" | Out-File -FilePath "publish/RNS.Companion.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RNS.Companion-win-x64
          path: |
            publish/RNS.Companion.exe
            publish/RNS.Companion.exe.sha256

      - name: GitHub Release (по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/RNS.Companion.exe
            publish/RNS.Companion.exe.sha256
          generate_release_notes: true
